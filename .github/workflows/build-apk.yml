name: Build QuickBars APK

on:
  workflow_dispatch:
    inputs:
      unlock_plus:
        description: 'Unlock Plus features locally (no store check)'
        type: boolean
        default: false
      build_type:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Patch sources for a self-built (non-Play) APK
        env:
          UNLOCK_PLUS: ${{ inputs.unlock_plus }}
        run: |
          cat > /tmp/patch.b64 <<'B64'
