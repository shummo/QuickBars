          YXRlIHZhbCBfaXNQbHVzID0gTXV0YWJsZVN0YXRlRmxvdyh0cnVlKSIpCiAgICAgICAgdGV4dCA9IHRleHQucmVwbGFjZShvbGRf
          dXBkLCAiX2lzUGx1cy52YWx1ZSA9IHRydWUiKQogICAgICAgIHBsdXMud3JpdGVfdGV4dCh0ZXh0KQogICAgICAgIHByaW50KCJw
          YXRjaGVkIFBsdXNTdGF0dXNNYW5hZ2VyLmt0IChQbHVzIGVuYWJsZWQgbG9jYWxseSkiKQogICAgZWxzZToKICAgICAgICBwcmlu
          dCgiUGx1cyBzdGF5cyBsb2NrZWQgKGZyZWUgdGllcjogMSBiYXIsIDEgdHJpZ2dlciBrZXkpIikKCgptYWluKCkK
          B64
          base64 -d /tmp/patch.b64 > /tmp/selfbuild_patch.py
          python3 /tmp/selfbuild_patch.py

      - name: Create a signing key for this build
        if: inputs.build_type == 'release'
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/selfbuild.jks" \
            -alias selfbuild -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass selfbuild -keypass selfbuild \
            -dname "CN=QuickBars Self Build, OU=Self, O=Self, L=NA, S=NA, C=NA"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -PREVENUECAT_API_KEY='"goog_selfbuild_placeholder"' \
              -PHA_QUICKBARS_KEYSTORE_FILE="$RUNNER_TEMP/selfbuild.jks" \
              -PHA_QUICKBARS_KEYSTORE_PASSWORD=selfbuild \
              -PHA_QUICKBARS_KEY_ALIAS=selfbuild \
              -PHA_QUICKBARS_KEY_PASSWORD=selfbuild
          else
            ./gradlew assembleDebug --no-daemon --stacktrace \
              -PREVENUECAT_API_KEY='"goog_selfbuild_placeholder"'
          fi

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: quickbars-apk
          path: artifacts/*.apk
          if-no-files-found: error
